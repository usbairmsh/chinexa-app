services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Performance tuning: a larger InnoDB buffer pool keeps hot data/indexes in
    # RAM instead of reading disk on every query (the single biggest MySQL
    # speed lever). Size it to ~50-60% of the RAM you can give the DB — bump to
    # 1G/2G if the VPS has room. redo log + I/O capacity raised for write
    # bursts (orders, stock updates).
    command: >-
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --innodb-flush-log-at-trx-commit=2
      --innodb-io-capacity=1000
      --max-connections=100
      --skip-name-resolve
    env_file:
      - .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # Bind MySQL to localhost only — it was published to 0.0.0.0:3306 (the whole
    # internet), which is a security risk and a resource drain from bots probing
    # it. The app reaches it over the internal Docker network ("db") regardless;
    # for a remote DB client, use an SSH tunnel to 127.0.0.1:3306.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # ":-api" default guarantees a real-DB build even if the var is unset,
        # so the app can never silently fall back to mock mode in production.
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
